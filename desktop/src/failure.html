<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 本地页面：只允许内联样式与脚本，不许任何外部资源 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>TT Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #181818;
        --card: #1f1f1f;
        --fg: #cccccc;
        --muted: #9a9a9a;
        --line: #2b2b2b;
        --accent: #0078d4;
        --danger: #f14c4c;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.6 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        padding: 22px 24px;
        overflow: hidden;
        /* 无边框窗口：整页可拖，按钮自己标 no-drag（见下） */
        -webkit-app-region: drag;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
      .logo {
        display: inline-flex; align-items: center; justify-content: center;
        width: 26px; height: 26px; border-radius: 6px;
        background: var(--accent); color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .5px;
      }
      h1 { font-size: 15px; font-weight: 600; margin: 18px 0 6px; color: var(--danger); }
      .detail { color: var(--muted); margin: 0 0 14px; white-space: pre-wrap; word-break: break-word; }
      .actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
      button {
        font: inherit; color: var(--fg); background: var(--card);
        border: 1px solid var(--line); border-radius: 6px; padding: 5px 14px; cursor: pointer;
        -webkit-app-region: no-drag;
      }
      button:hover { border-color: #3c3c3c; }
      button:disabled { opacity: .55; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { background: #1f8ce0; }
      button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
      pre {
        margin: 14px 0 0; padding: 10px 12px; background: var(--card); border: 1px solid var(--line);
        border-radius: 6px; color: var(--muted); font: 11px/1.5 Consolas, monospace;
        flex: 1; overflow: auto; white-space: pre-wrap; word-break: break-all; min-height: 0;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="brand"><span class="logo">TT</span><span id="brand">TT Desktop · T100 人机协同调试</span></div>
    <h1 id="title">启动失败</h1>
    <p class="detail" id="detail"></p>
    <div class="actions">
      <button class="primary" id="retry">重试</button>
      <button id="open-log">打开日志</button>
      <button id="copy-diag">复制诊断信息</button>
      <button class="ghost" id="quit">退出</button>
    </div>
    <pre id="log" hidden></pre>
    <script>
      // 只在"起不来"的时候出现：服务没能起来 / 服务意外退出 / 界面进程退出。
      // 文案只讲"发生了什么、下一步点哪"，不讲端口与服务实现（用户不关心）。
      const q = new URLSearchParams(location.search)
      const api = window.ttDesktop
      const $ = (id) => document.getElementById(id)

      $('title').textContent = q.get('title') || '启动失败'
      $('detail').textContent = q.get('detail') || ''
      const logText = q.get('log') || ''
      if (logText) {
        $('log').textContent = logText
        $('log').hidden = false
      }

      // 重试：服务在后台重新拉起，成功了会直接开主窗、这一页随之关掉，
      // 所以这里不给进度条，只把按钮锁住，免得连点。
      $('retry').addEventListener('click', () => {
        if (!api) return
        $('retry').disabled = true
        $('retry').textContent = '正在重启…'
        api.retry()
      })
      $('open-log').addEventListener('click', () => api && api.openLog())
      $('copy-diag').addEventListener('click', async () => {
        if (!api) return
        const ok = await api.copyDiag()
        $('copy-diag').textContent = ok ? '已复制' : '复制失败'
      })
      $('quit').addEventListener('click', () => api && api.quit())

      if (api) {
        api.info().then((info) => {
          if (info && info.version) $('brand').textContent = `TT Desktop ${info.version} · T100 人机协同调试`
        })
      }
    </script>
  </body>
</html>
