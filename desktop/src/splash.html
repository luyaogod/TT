<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 本地页面：只允许内联样式与脚本，不许任何外部资源 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>TT Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #181818;
        --card: #1f1f1f;
        --fg: #cccccc;
        --muted: #9a9a9a;
        --line: #2b2b2b;
        --accent: #0078d4;
        --danger: #f14c4c;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.6 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        padding: 22px 24px;
        overflow: hidden;
      }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
      .logo {
        display: inline-flex; align-items: center; justify-content: center;
        width: 26px; height: 26px; border-radius: 6px;
        background: var(--accent); color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .5px;
      }
      h1 { font-size: 15px; font-weight: 600; margin: 18px 0 6px; }
      h1.error { color: var(--danger); }
      .detail { color: var(--muted); margin: 0 0 14px; white-space: pre-wrap; word-break: break-word; }
      .bar { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
      .bar > i {
        display: block; height: 100%; width: 35%; background: var(--accent); border-radius: 3px;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
      .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
      button {
        font: inherit; color: var(--fg); background: var(--card);
        border: 1px solid var(--line); border-radius: 6px; padding: 5px 14px; cursor: pointer;
      }
      button:hover { border-color: #3c3c3c; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { background: #1f8ce0; }
      button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
      pre {
        margin: 14px 0 0; padding: 10px 12px; background: var(--card); border: 1px solid var(--line);
        border-radius: 6px; color: var(--muted); font: 11px/1.5 Consolas, monospace;
        flex: 1; overflow: auto; white-space: pre-wrap; word-break: break-all; min-height: 0;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="brand"><span class="logo">TT</span><span id="brand">TT Desktop · T100 人机协同调试</span></div>
    <h1 id="title">正在启动…</h1>
    <p class="detail" id="detail"></p>
    <div class="bar" id="bar"><i></i></div>
    <div class="actions" id="actions" hidden>
      <button class="primary" id="retry">重试</button>
      <button id="open-log">打开日志</button>
      <button id="copy-diag">复制诊断信息</button>
      <button class="ghost" id="quit">退出</button>
    </div>
    <pre id="log" hidden></pre>
    <script>
      // 三种状态共用这一页：loading / error / crashed（由主进程用 query 传进来）。
      // 文案只讲"发生了什么、下一步点哪"，不讲端口与服务实现（用户不关心）。
      const q = new URLSearchParams(location.search)
      const stateName = q.get('state') || 'loading'
      const api = window.ttDesktop
      const $ = (id) => document.getElementById(id)

      $('title').textContent = q.get('title') || (stateName === 'loading' ? '正在启动…' : '启动失败')
      if (stateName !== 'loading') $('title').classList.add('error')
      $('detail').textContent = q.get('detail') || ''
      const logText = q.get('log') || ''
      if (logText) {
        $('log').textContent = logText
        $('log').hidden = false
      }
      if (stateName === 'loading') {
        $('bar').hidden = false
      } else {
        $('bar').hidden = true
        $('actions').hidden = false
      }

      $('retry').addEventListener('click', () => api && api.retry())
      $('open-log').addEventListener('click', () => api && api.openLog())
      $('copy-diag').addEventListener('click', async () => {
        if (!api) return
        const ok = await api.copyDiag()
        $('copy-diag').textContent = ok ? '已复制' : '复制失败'
      })
      $('quit').addEventListener('click', () => api && api.quit())

      if (api) {
        api.boot().then((info) => {
          if (info && info.version) $('brand').textContent = `TT Desktop ${info.version} · T100 人机协同调试`
        })
      }
    </script>
  </body>
</html>
