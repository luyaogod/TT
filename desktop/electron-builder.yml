appId: com.luyao.tt.desktop
productName: TT Desktop
copyright: Copyright © luyao

directories:
  output: release
  buildResources: build

# 壳自己（asar 里只有这几样）：主进程、启动页、preload、package.json。
# 载荷（tt.exe / tzs / designer / skills）在 extraResources 里，**不进 asar** ——
# spawn 需要真实路径。
files:
  - src/**/*
  - package.json

extraResources:
  - from: payload/tt
    to: tt

asar: true

# 只出 `--dir` 的应用目录：安装包由 Inno Setup 编译（见 installer/tt-desktop.iss），
# 免安装 zip 由 tools/zip -flat 打。electron-builder 的 NSIS 目标已弃用 —— 它的
# 安装器在本机跑不起来（终端安全拦 NSIS 运行时），而打包时必须先运行一次安装器。
win:
  target:
    - target: dir
      arch: [x64]
  icon: build/icon.ico
  # 只用于 electron-builder 自己的临时产物；发布名由 build_desktop.bat 决定
  artifactName: TT-Desktop-${version}-${arch}.${ext}
