    </marker>
  </defs>

  <!-- ================= 标题 ================= -->
  <text x="40" y="58" style="font-size:30px;font-weight:700;fill:#0f172a">T100 登录 · 环境变量 · ENT 与数据库</text>
  <text x="40" y="88" class="ts" style="font-size:14px">
    一台服务器六套 T100 ｜ 一次 SSH 登录决定全部环境 ｜ 进系统后选企业，只换数据库连接、不动环境变量
  </text>
  <g transform="translate(1180,36)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="90" y="20" text-anchor="middle" class="tag" fill="#0369a1">只读实勘 · 172.16.1.109</text>
  </g>

  <!-- ============ ① 电梯 / 菜单 ============ -->
  <rect class="card" x="40" y="104" width="1320" height="360" rx="16"/>
  <circle cx="72" cy="132" r="13" fill="#2563eb"/>
  <text x="72" y="137" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#fff">1</text>
  <text x="96" y="139" class="sec">登录 = 按电梯：那块“菜单”决定 ZONE</text>
  <text x="96" y="160" class="ts">
    ~/.profile 是个符号链接，指向 /u3/pub/bin/chenv —— 所以“登录”这个动作本身就在问你：去哪一层？
  </text>

  <!-- 六个楼层按钮 -->
  <g>
    <rect x="64" y="176" width="300" height="38" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="84" y="201" class="mono" style="font-size:14px;font-weight:700;fill:#1d4ed8">31</text>
    <text x="126" y="201" class="mono" style="font-size:14px;fill:#0f172a">t35dev</text>
    <text x="352" y="201" text-anchor="end" class="ts">开发区</text>

    <rect x="64" y="220" width="300" height="38" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.4"/>
    <text x="84" y="245" class="mono" style="font-size:14px;font-weight:700;fill:#1d4ed8">35</text>
    <text x="126" y="245" class="mono" style="font-size:14px;font-weight:700;fill:#0f172a">t35tst</text>
    <text x="352" y="245" text-anchor="end" class="ts" style="fill:#1d4ed8">测试区（下例用它）</text>

    <rect x="64" y="264" width="300" height="38" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="84" y="289" class="mono" style="font-size:14px;font-weight:700;fill:#1d4ed8">36</text>
    <text x="126" y="289" class="mono" style="font-size:14px;fill:#0f172a">t35prd</text>
    <text x="352" y="289" text-anchor="end" class="ts">正式区</text>

    <rect x="64" y="308" width="300" height="38" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="84" y="333" class="mono" style="font-size:14px;font-weight:700;fill:#1d4ed8">39</text>
    <text x="126" y="333" class="mono" style="font-size:14px;fill:#0f172a">t35pth</text>
    <text x="352" y="333" text-anchor="end" class="ts">PATCH 区</text>

    <rect x="64" y="352" width="300" height="38" rx="9" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="84" y="377" class="mono" style="font-size:14px;font-weight:700;fill:#b45309">t</text>
    <text x="126" y="377" class="mono" style="font-size:14px;fill:#0f172a">topprd</text>
    <text x="352" y="377" text-anchor="end" class="ts" style="fill:#b45309">出货区（标准版）</text>

    <rect x="64" y="396" width="300" height="38" rx="9" fill="#fee2e2" stroke="#f87171" stroke-dasharray="5 4"/>
    <text x="84" y="421" class="mono" style="font-size:14px;font-weight:700;fill:#b91c1c">36k</text>
    <text x="126" y="421" class="mono" style="font-size:14px;fill:#b91c1c">k35prd</text>
    <text x="352" y="421" text-anchor="end" class="ts" style="fill:#b91c1c">金仓 —— 入口断了 ✗</text>
  </g>

  <!-- ZONE 扇出 -->
  <rect x="416" y="262" width="112" height="48" rx="10" fill="#2563eb"/>
  <text x="472" y="292" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#fff">ZONE</text>
  <path class="arrow" d="M528,286 L560,286" marker-end="url(#arl)"/>
  <path d="M560,200 L560,376" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <g stroke="#3b82f6" stroke-width="2">
    <path d="M560,200 L580,200"/><path d="M560,244 L580,244"/>
    <path d="M560,288 L580,288"/><path d="M560,332 L580,332"/>
    <path d="M560,376 L580,376"/>
  </g>

  <text x="590" y="205" class="code" style="font-size:15px">TOP = /u1/&lt;ZONE&gt;</text>
  <text x="1330" y="205" text-anchor="end" class="ts">程序在哪（erp / com / utl）</text>

  <text x="590" y="249" class="code" style="font-size:15px">ORACLE_SID = TWO_TASK = &lt;ZONE&gt;</text>
  <text x="1330" y="249" text-anchor="end" class="ts">连哪个 Oracle 服务</text>

  <text x="590" y="293" class="code" style="font-size:15px">FGLPROFILE = …/fglprofile.&lt;ZONE&gt;</text>
  <text x="1330" y="293" text-anchor="end" class="ts">用哪份账号表</text>

  <text x="590" y="337" class="code" style="font-size:15px">FGLASIP = http://172.16.1.109/&lt;ZONE&gt;</text>
  <text x="1330" y="337" text-anchor="end" class="ts">Web 指向哪个应用服务</text>

  <text x="590" y="381" class="code" style="font-size:15px">TEMPDIR = /ut/&lt;ZONE&gt;/tmp</text>
  <text x="1330" y="381" text-anchor="end" class="ts">临时 / 日志目录</text>

  <text x="64" y="452" class="ts">
    映射写在 /u3/pub/bin/chenv 的 case $ans 里；36k 那一支被注释掉，只剩 *) exit —— 选到它，一个变量都拿不到就退出。
  </text>

  <!-- ============ ② 三层拼装 ============ -->
  <rect class="card" x="40" y="484" width="1320" height="300" rx="16"/>
  <circle cx="72" cy="512" r="13" fill="#4f46e5"/>
  <text x="72" y="517" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#fff">2</text>
  <text x="96" y="519" class="sec">三层拼装，凑出 308 个环境变量</text>
  <text x="96" y="540" class="ts">登录前 env 里一个 T100 变量都没有；登录后 308 个，其中 205 个是扫目录自动生成的模块变量。</text>

  <!-- 三个盒子 -->
  <rect x="64" y="560" width="390" height="150" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="84" y="588" class="code" style="font-size:14px;font-weight:700">/u3/pub/etc/chenv</text>
  <text x="84" y="612" class="ts">«本层须知» · 按 ZONE 出旗标</text>
  <text x="84" y="636" class="mono" style="font-size:12.5px;fill:#4338ca">TOPCHKOUT / TOPALM</text>
  <text x="84" y="658" class="mono" style="font-size:12.5px;fill:#4338ca">TOPIND / DGENV / CUST / ORG</text>
  <text x="84" y="684" class="ts" style="font-size:11.5px">topprd 是标准版，其它是行业包</text>

  <path class="arrow" d="M454,635 L492,635" marker-end="url(#ar)"/>

  <rect x="496" y="560" width="390" height="150" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="516" y="588" class="code" style="font-size:14px;font-weight:700">/u3/pub/etc/topenv</text>
  <text x="516" y="612" class="ts">«全楼通用设置» · 真正的 env 引擎</text>
  <text x="516" y="636" class="mono" style="font-size:12.5px;fill:#4338ca">Oracle / Genero / PATH / CLASSPATH</text>
  <text x="516" y="658" class="mono" style="font-size:12.5px;fill:#4338ca">TOP / ERP / COM / UTL / RES</text>
  <text x="516" y="684" class="ts" style="font-size:11.5px">开头先 unset，所以可重复 source</text>

  <path class="arrow" d="M886,635 L924,635" marker-end="url(#ar)"/>

  <rect x="928" y="560" width="400" height="150" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="948" y="588" class="code" style="font-size:14px;font-weight:700">topsys + topalias</text>
  <text x="948" y="612" class="ts">«工具在哪» · 扫目录 + 命令别名</text>
  <text x="948" y="636" class="mono" style="font-size:12.5px;fill:#4338ca">AIM = $ERP/aim　AIMi = $ERP/aim/42r</text>
  <text x="948" y="658" class="mono" style="font-size:12.5px;fill:#4338ca">CLIB / CQRY / CSUB / LNG / WSS</text>
  <text x="948" y="684" class="ts" style="font-size:11.5px">menu = r.r azzi000　r.t / account …</text>

  <rect x="430" y="716" width="540" height="42" rx="21" fill="#dcfce7" stroke="#4ade80"/>
  <text x="700" y="743" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:#15803d">
    实测 308 个变量（登录前 = 0）
  </text>

  <!-- ============ ③ 三个 chenv ============ -->
  <rect class="card" x="40" y="804" width="1320" height="130" rx="16" stroke="#fcd34d"/>
  <text x="64" y="838" style="font-size:17px;font-weight:700;fill:#b45309">⚠ 三个都叫 chenv 的文件，别搞混</text>

  <rect x="64" y="856" width="418" height="60" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="84" y="879" class="code" style="font-size:13px;font-weight:700">/u3/pub/bin/chenv</text>
  <text x="84" y="900" class="ts" style="font-size:12px">电梯按钮：打印菜单、定 ZONE、往下分发</text>

  <rect x="500" y="856" width="418" height="60" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="520" y="879" class="code" style="font-size:13px;font-weight:700">/u3/pub/etc/chenv</text>
  <text x="520" y="900" class="ts" style="font-size:12px">本层须知：按 ZONE 出 TOPCHKOUT / TOPIND 等</text>

  <rect x="936" y="856" width="392" height="60" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="956" y="879" class="code" style="font-size:13px;font-weight:700;fill:#b91c1c">/u1/etc/chenv</text>
  <text x="956" y="900" class="ts" style="font-size:12px;fill:#b91c1c">老版须知：Web 用，规则已经不同了</text>

  <!-- ============ ④ 两份 topenv / 两份 webrun ============ -->
  <rect class="card" x="40" y="954" width="1320" height="250" rx="16"/>
  <circle cx="72" cy="982" r="13" fill="#0d9488"/>
  <text x="72" y="987" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#fff">3</text>
  <text x="96" y="989" class="sec">两份 topenv / 两份 webrun：到底哪一份在跑</text>
  <text x="96" y="1010" class="ts">GAS 的 DVM 是 $(res.envdir)/webrun = /u1/etc/webrun，而它 source 的是 /u3/pub/etc/* —— 所以 Web 和终端用的是同一份。</text>

  <rect x="64" y="1026" width="628" height="160" rx="12" fill="#f0fdfa" stroke="#34d399" stroke-width="2"/>
  <text x="84" y="1050" style="font-size:14px;font-weight:700;fill:#047857">✓ 实际在跑的这一份</text>
  <text x="84" y="1074" class="code" style="font-size:13px;font-weight:700">/u3/pub/etc/topenv</text>
  <text x="84" y="1100" class="ts" style="font-size:11.5px">交互登录 与 Web 都 source 它</text>
  <text x="84" y="1124" class="mono" style="font-size:12.5px;fill:#334155">FGLPROFILE = /u3/pub/etc/fglprofile.&lt;ZONE&gt;</text>
  <text x="84" y="1146" class="mono" style="font-size:12.5px;fill:#334155">ORACLE_SID / TWO_TASK　<tspan style="fill:#047857;font-weight:700">可改</tspan></text>
  <text x="84" y="1170" class="ts" style="font-size:11.5px">webrun 只额外前置 fglprofile.cpu、设 fgllicense.cpu</text>

  <rect x="712" y="1026" width="616" height="160" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="732" y="1050" style="font-size:14px;font-weight:700;fill:#64748b">✗ 旧版，当前没有调用者</text>
  <text x="732" y="1074" class="code" style="font-size:13px;font-weight:700;fill:#64748b">/u1/etc/topenv</text>
  <text x="732" y="1100" class="ts" style="font-size:11.5px">只被旧的 /u3/pub/etc/webrun 引用（已无人调用）</text>
  <text x="732" y="1124" class="mono" style="font-size:12.5px;fill:#475569">FGLPROFILE = /u1/etc/fglprofile.&lt;ZONE&gt;</text>
  <text x="732" y="1146" class="mono" style="font-size:12.5px;fill:#475569">ORACLE_SID / TWO_TASK　<tspan style="fill:#b91c1c;font-weight:700">readonly 🔒</tspan></text>
  <text x="732" y="1170" class="ts" style="font-size:11.5px">readonly 只锁在这一份里，所以在跑的那套并不受它限制</text>

  <!-- ============ ⑤ 作业链路 ============ -->
  <rect class="card" x="40" y="1224" width="1320" height="250" rx="16"/>
  <circle cx="72" cy="1252" r="13" fill="#2563eb"/>
  <text x="72" y="1257" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#fff">4</text>
  <text x="96" y="1259" class="sec">作业是怎么起来的：一个搬运工把程序搬进去</text>

  <rect x="64" y="1284" width="228" height="58" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="178" y="1319" text-anchor="middle" class="mono" style="font-size:16px;font-weight:700;fill:#1d4ed8">menu</text>
  <path class="arrow" d="M294,1313 L332,1313" marker-end="url(#ar)"/>

  <rect x="336" y="1284" width="248" height="58" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="460" y="1319" text-anchor="middle" class="mono" style="font-size:16px;font-weight:700;fill:#1d4ed8">r.r</text>
  <path class="arrow" d="M586,1313 L624,1313" marker-end="url(#ar)"/>

  <rect x="628" y="1284" width="300" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="778" y="1319" text-anchor="middle" class="mono" style="font-size:15px;font-weight:700;fill:#334155">azzp000.42r</text>
  <path class="arrow" d="M930,1313 L968,1313" marker-end="url(#ar)"/>

  <rect x="972" y="1284" width="356" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1150" y="1319" text-anchor="middle" class="mono" style="font-size:16px;font-weight:700;fill:#1d4ed8">azzi000</text>

  <text x="178" y="1366" text-anchor="middle" class="ts" style="font-size:11.5px">别名（topalias）</text>
  <text x="460" y="1366" text-anchor="middle" class="ts" style="font-size:11.5px">$TEMPDIR 下启动</text>
  <text x="778" y="1366" text-anchor="middle" class="ts" style="font-size:11.5px">作业加载器 · 只有编译件，无源码</text>
  <text x="1150" y="1366" text-anchor="middle" class="ts" style="font-size:11.5px">系统首页 · SCHEMA ds 写死</text>

  <rect x="64" y="1384" width="1264" height="34" rx="8" fill="#0f172a"/>
  <text x="84" y="1406" class="dark">$FGLRUN  $AZZ/42r/azzp000.42r   azzi000</text>
  <text x="1306" y="1406" text-anchor="end" class="cmt">← r.r 就这么一行，作业号当参数传进去</text>

  <text x="64" y="1448" class="ts">
    账号密码校验发生在更前面（azzp000 里）；azzi000 只负责首页与菜单，它既不选企业也不切库。
  </text>

  <!-- ============ ⑥ 切 ENT ============ -->
  <rect class="card" x="40" y="1494" width="1320" height="340" rx="16"/>
  <circle cx="72" cy="1522" r="13" fill="#059669"/>
  <text x="72" y="1527" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#fff">5</text>
  <text x="96" y="1529" class="sec">切企业（ENT）= 查一张表，换个档案室</text>
  <text x="96" y="1550" class="ts">这张表就是 gzou_t：公司编号 → 数据库 schema 名。换档案室，一个环境变量都不动。</text>

  <!-- 表 -->
  <rect x="64" y="1570" width="440" height="34" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="84" y="1592" class="mono" style="font-size:12.5px;font-weight:700;fill:#065f46">gzou001（ENT）</text>
  <text x="300" y="1592" class="mono" style="font-size:12.5px;font-weight:700;fill:#065f46">gzou003（schema）</text>

  <rect x="64" y="1604" width="440" height="36" fill="#fff" stroke="#a7f3d0"/>
  <text x="84" y="1627" class="mono" style="font-size:12.5px;fill:#334155">1, 2, 3, 8, 10, 11, 99, 527 …</text>
  <text x="300" y="1627" class="codeg" style="font-size:12.5px;font-weight:700">dsdemo</text>

  <rect x="64" y="1640" width="440" height="36" fill="#f0fdf4" stroke="#a7f3d0"/>
  <text x="84" y="1663" class="mono" style="font-size:12.5px;fill:#334155">2222</text>
  <text x="300" y="1663" class="codeg" style="font-size:12.5px;font-weight:700">dsstd</text>

  <rect x="64" y="1676" width="440" height="36" fill="#fff" stroke="#a7f3d0"/>
  <text x="84" y="1699" class="mono" style="font-size:12.5px;fill:#334155">（正式区另有 7 家）</text>
  <text x="300" y="1699" class="codeg" style="font-size:12.5px;font-weight:700">dsdata</text>

  <path d="M282,1570 L282,1712" stroke="#6ee7b7" stroke-width="1"/>

  <text x="64" y="1740" class="ts" style="font-size:11.5px">实测：t35tst 18 家 / t35prd 27 家启用企业</text>
