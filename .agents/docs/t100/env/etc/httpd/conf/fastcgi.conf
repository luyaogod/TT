</IfModule>

#---- $TEMPDIR ----
Alias /topprd/out "/ut/topprd/tmp"
<Directory "/ut/topprd/tmp">
    Options MultiViews Indexes
    Options -Indexes
    AllowOverride None
    Order allow,deny
    Allow from all
    Require all granted
</Directory>

