  ProxyPass /wt35pth/ fcgi://172.16.1.109:6397/ timeout=300
  Alias /wtopprd /u1/genero/gas/bin/fastcgidispatch
  Alias /wt35prd /u1/genero/gas/bin/fastcgidispatch
  Alias /wt35tst /u1/genero/gas/bin/fastcgidispatch
  Alias /wt35dev /u1/genero/gas/bin/fastcgidispatch
  Alias /wt35pth /u1/genero/gas/bin/fastcgidispatch
  #3.1.01 add (s)
  #為確保 Genero GIP 服務能使用，下方設定需啟用
  RewriteEngine on
  RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
  #3.1.01 add (e)
</IfModule>
