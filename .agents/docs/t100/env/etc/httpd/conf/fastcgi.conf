  #SetEnvIf Request_URI . proxy-fcgi-pathinfo=1  #3.1.01 mark
  #3.1.01 add (s)
  SetEnvIf Request_URI . proxy-fcgi-pathinfo=unescape
  #3.1.01 add (e)
  ProxyPass /wstopprd/ fcgi://172.16.1.109:6370/ timeout=300
  ProxyPass /wtopprd/ fcgi://172.16.1.109:6394/ timeout=300
  ProxyPass /wt35prd/ fcgi://172.16.1.109:6398/ timeout=300
  ProxyPass /wt35tst/ fcgi://172.16.1.109:6395/ timeout=300
