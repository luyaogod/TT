<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TT 四层架构</title>
  <desc id="desc">命令层、共享层、能力层、基础层与外部系统之间的单向依赖关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#7c8fa2"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;fill:#1d2f43}
      .kicker{font:700 11px ui-monospace,Consolas,monospace;letter-spacing:.15em;fill:#4d7fb8}
      .h{font-size:15px;font-weight:700}
      .n{font-size:13px;font-weight:650}
      .s{font-size:11px;fill:#64778b}
      .xs{font-size:10px;fill:#7d8fa2}
      .ink{fill:#eef6ff}
      .box{fill:#fff;stroke:#cbd8e6;stroke-width:1.2}
      .cmd{fill:#eef5ff;stroke:#9fc0ff}
      .shared{fill:#f8fafc;stroke:#d8e2ec}
      .cap{fill:#edf9f5;stroke:#8bd8c8}
      .base{fill:#f2efff;stroke:#b8a9f2}
      .ext{fill:#fff6ea;stroke:#efc28f}
      .wire{fill:none;stroke:#7c8fa2;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f8fbff"/>
  <rect x="16" y="16" width="1168" height="728" rx="24" fill="#fbfdff" stroke="#dbe6f1"/>

  <text class="kicker" x="46" y="48">TT / 4 LAYERS</text>
  <text class="h" x="46" y="73">单向依赖，唯一接线</text>
  <text class="s" x="46" y="94">消费者只看到契约；命令层把能力接起来；能力层各自独立；基础层不反向依赖业务。</text>

  <rect class="box" x="390" y="112" width="420" height="52" rx="12" fill="#0d1b2e" stroke="#0d1b2e"/>
  <text class="n" x="600" y="134" text-anchor="middle" fill="#eef6ff">人 / Agent / 脚本 / 浏览器</text>
  <text class="xs" x="600" y="152" text-anchor="middle" fill="#a9c4e1">只消费契约，不靠猜</text>
  <path class="wire" d="M600 164 L600 190"/>

  <rect class="box cmd" x="46" y="198" width="1108" height="112" rx="16"/>
  <text class="kicker" x="68" y="222">01 / COMMAND</text>
  <text class="h" x="210" y="222">cobra 命令树：唯一的接线处</text>
  <g>
    <rect class="box" x="68" y="238" width="104" height="30" rx="7"/><text class="s" x="120" y="257" text-anchor="middle">debug</text>
    <rect class="box" x="180" y="238" width="104" height="30" rx="7"/><text class="s" x="232" y="257" text-anchor="middle">dev</text>
    <rect class="box" x="292" y="238" width="104" height="30" rx="7"/><text class="s" x="344" y="257" text-anchor="middle">dict</text>
    <rect class="box" x="404" y="238" width="104" height="30" rx="7"/><text class="s" x="456" y="257" text-anchor="middle">file</text>
    <rect class="box" x="516" y="238" width="104" height="30" rx="7"/><text class="s" x="568" y="257" text-anchor="middle">interface</text>
    <rect class="box" x="628" y="238" width="104" height="30" rx="7"/><text class="s" x="680" y="257" text-anchor="middle">outline</text>
    <rect class="box" x="740" y="238" width="104" height="30" rx="7"/><text class="s" x="792" y="257" text-anchor="middle">session</text>
    <rect class="box" x="852" y="238" width="104" height="30" rx="7"/><text class="s" x="904" y="257" text-anchor="middle">drawio</text>
    <rect class="box" x="964" y="238" width="166" height="30" rx="7"/><text class="s" x="1047" y="257" text-anchor="middle">env / config / serve / install</text>
  </g>
  <text class="xs" x="68" y="292">命令组之间没有 import 边</text>
  <path class="wire" d="M600 310 L600 336"/>

  <rect class="box shared" x="46" y="344" width="1108" height="78" rx="16"/>
  <text class="kicker" x="68" y="367">02 / SHARED</text>
  <text class="h" x="210" y="367">所有命令都同意的事</text>
  <g>
    <rect class="box" x="68" y="380" width="240" height="30" rx="7"/><text class="s" x="188" y="399" text-anchor="middle">at · --at 坐标与作用域</text>
    <rect class="box" x="322" y="380" width="240" height="30" rx="7"/><text class="s" x="442" y="399" text-anchor="middle">output · 信封与渲染</text>
    <rect class="box" x="576" y="380" width="240" height="30" rx="7"/><text class="s" x="696" y="399" text-anchor="middle">config · 路径 / 原子写 / 打码</text>
    <rect class="box" x="830" y="380" width="300" height="30" rx="7"/><text class="s" x="980" y="399" text-anchor="middle">common · 共享开关 / 注入点 / MetaProvider</text>
  </g>
  <path class="wire" d="M600 422 L600 448"/>

  <rect class="box cap" x="46" y="456" width="1108" height="98" rx="16"/>
  <text class="kicker" x="68" y="479">03 / CAPABILITIES</text>
  <text class="h" x="210" y="479">能力内核：各自独立，靠装配相连</text>
  <g>
    <rect class="box" x="68" y="492" width="198" height="46" rx="9"/><text class="n" x="167" y="512" text-anchor="middle">debug</text><text class="xs" x="167" y="528" text-anchor="middle">会话 / 事件流 / HTTP</text>
    <rect class="box" x="278" y="492" width="198" height="46" rx="9"/><text class="n" x="377" y="512" text-anchor="middle">dev</text><text class="xs" x="377" y="528" text-anchor="middle">.tzc / .tzs 管线</text>
    <rect class="box" x="488" y="492" width="198" height="46" rx="9"/><text class="n" x="587" y="512" text-anchor="middle">dict</text><text class="xs" x="587" y="528" text-anchor="middle">字典 / 本地与远程数据源</text>
    <rect class="box" x="698" y="492" width="198" height="46" rx="9"/><text class="n" x="797" y="512" text-anchor="middle">web</text><text class="xs" x="797" y="528" text-anchor="middle">REST / WebSocket / SPA</text>
    <rect class="box" x="908" y="492" width="222" height="46" rx="9"/><text class="n" x="1019" y="512" text-anchor="middle">drawio</text><text class="xs" x="1019" y="528" text-anchor="middle">原型图 / 形状库</text>
  </g>
  <path class="wire" d="M600 554 L600 580"/>

  <rect class="box base" x="46" y="588" width="1108" height="70" rx="16"/>
  <text class="kicker" x="68" y="611">04 / FOUNDATIONS</text>
  <text class="h" x="210" y="611">基础能力：可独立测试的底座</text>
  <g>
    <rect class="box" x="68" y="620" width="160" height="26" rx="6"/><text class="xs" x="148" y="637" text-anchor="middle">host · SSH / 文件</text>
    <rect class="box" x="238" y="620" width="160" height="26" rx="6"/><text class="xs" x="318" y="637" text-anchor="middle">erpdb · 客户端直连</text>
    <rect class="box" x="408" y="620" width="160" height="26" rx="6"/><text class="xs" x="488" y="637" text-anchor="middle">dbconfig · 连接模型</text>
    <rect class="box" x="578" y="620" width="160" height="26" rx="6"/><text class="xs" x="658" y="637" text-anchor="middle">entdir · ENT→账号</text>
    <rect class="box" x="748" y="620" width="160" height="26" rx="6"/><text class="xs" x="828" y="637" text-anchor="middle">safesql · 只读 SQL</text>
    <rect class="box" x="918" y="620" width="212" height="26" rx="6"/><text class="xs" x="1024" y="637" text-anchor="middle">sshtun / winproc · 隧道 / 进程</text>
  </g>
  <path class="wire" d="M600 658 L600 680"/>

  <g>
    <rect class="box ext" x="68" y="690" width="250" height="28" rx="7"/><text class="xs" x="193" y="708" text-anchor="middle">Linux / SSH / T100 runtime</text>
    <rect class="box ext" x="330" y="690" width="220" height="28" rx="7"/><text class="xs" x="440" y="708" text-anchor="middle">Oracle / Kingbase</text>
    <rect class="box ext" x="562" y="690" width="220" height="28" rx="7"/><text class="xs" x="672" y="708" text-anchor="middle">本地 SQLite / SFTP</text>
    <rect class="box ext" x="794" y="690" width="336" height="28" rx="7"/><text class="xs" x="962" y="708" text-anchor="middle">设计器程序集 / tzs-server.exe</text>
  </g>
  <text class="xs" x="46" y="742">依赖只朝下；跨线连接只在命令层装配处发生。</text>
</svg>
