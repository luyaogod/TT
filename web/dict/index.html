<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TT — T100 数据字典</title>
    <script>
      // 首屏防闪色:渲染前按持久化主题挂 dark class(默认暗色;支持 亮色/暗色/跟随系统)。
      //
      // ⚠ 这段脚本与调试工作台的 index.html **必须一致**(同一个 localStorage 键、
      // 同一套判定):两套页面共用一个主题选择,而共享的 tokens.css 把 .dark 变体从
      // 「跟随系统」翻成了「跟随 html.dark」—— 少了这段脚本,本页会永久停在亮色
      // 且毫无报错(样式照常编译、构建照样绿)。
      ;(function () {
        try {
          var m = localStorage.getItem('tt.theme') || 'dark'
          var dark = m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) { /* 读不到就保持默认暗色 */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
