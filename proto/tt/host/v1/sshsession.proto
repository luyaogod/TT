// SSH 会话数据面：一次性非交互命令执行 + 远端文件读写。
//
// 首版不提供 PTY。文件读写是给插件搬运资源文件（例如节点图片）用的，
// 单次有大小上限（connsvc.MaxFileBytes）。
syntax = "proto3";

package tt.host.v1;

option go_package = "github.com/luyaogod/TT/pkg/hostv1;hostv1";

message SSHExecRequest {
  string handle = 1;
  string command = 2;
  // timeout_ms 执行超时；0 = 由 Host 的默认上限决定。超时即关闭通道（远端进程收 HUP）。
  int32 timeout_ms = 3;
}

message SSHExecResponse {
  // output 合并后的 stdout+stderr。
  string output = 1;
  // exit_code 远端命令退出码；因超时未能取到时为 -1。
  int32 exit_code = 2;
  // timed_out 是否因超时被终止。
  bool timed_out = 3;
}

// GetFileRequest 读一个远端文件。
message GetFileRequest {
  string handle = 1;
  string path = 2;
}

message GetFileResponse {
  bytes data = 1;
}

// PutFileRequest 写一个远端文件（父目录不存在时由 Host 创建）。
message PutFileRequest {
  string handle = 1;
  string path = 2;
  bytes data = 3;
}

message PutFileResponse {}

service SSHSessionService {
  rpc Exec(SSHExecRequest) returns (SSHExecResponse);
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  rpc PutFile(PutFileRequest) returns (PutFileResponse);
}
